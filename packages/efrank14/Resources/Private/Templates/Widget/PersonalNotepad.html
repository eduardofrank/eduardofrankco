<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
>
<f:layout name="Widget/Widget" />

<f:section name="main">
    <f:if condition="{notes}">
        <f:then>
            <div class="personal-notepad">
                <f:for each="{notes}" as="note" iteration="iterator">
                    <f:switch expression="{note.category}">
                        <f:case value="1"><f:variable name="categoryLabel" value="Instructions" /><f:variable name="categoryClass" value="info" /></f:case>
                        <f:case value="2"><f:variable name="categoryLabel" value="Template" /><f:variable name="categoryClass" value="warning" /></f:case>
                        <f:case value="3"><f:variable name="categoryLabel" value="Notes" /><f:variable name="categoryClass" value="notice" /></f:case>
                        <f:case value="4"><f:variable name="categoryLabel" value="To-do" /><f:variable name="categoryClass" value="success" /></f:case>
                        <f:defaultCase><f:variable name="categoryLabel" value="Default" /><f:variable name="categoryClass" value="" /></f:defaultCase>
                    </f:switch>
                    <div class="personal-notepad-item {categoryClass}">
                        <div class="personal-notepad-item-header">
                            <strong class="personal-notepad-item-subject">
                                <core:icon identifier="sysnote-type-{note.category}" size="small" />
                                {note.subject}
                            </strong>
                            <span class="personal-notepad-item-meta">
                                <span class="badge badge-{categoryClass}">{categoryLabel}</span>
                                <f:format.date format="{dateFormat} {timeFormat}">{note.crdate}</f:format.date>
                            </span>
                        </div>
                        <div class="personal-notepad-item-message">
                            <f:format.nl2br>{note.message}</f:format.nl2br>
                        </div>
                    </div>
                    <f:if condition="!{iterator.isLast}">
                        <hr class="personal-notepad-divider" />
                    </f:if>
                </f:for>
            </div>
        </f:then>
        <f:else>
            <p class="text-muted">No personal notes found. Create a sys_note record with the "Personal" checkbox enabled.</p>
        </f:else>
    </f:if>
</f:section>

<f:section name="footer">
</f:section>
</html>
