services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  CodingMs\FluidFpdf\:
    resource: '../Classes/*'

  CodingMs\FluidFpdf\EventListener\DrawItem:
    tags:
      - name: event.listener
        identifier: 'fluidFpdfDrawItemEvent'

  CodingMs\FluidFpdf\EventListener\DrawPdfFooter:
    tags:
      - name: event.listener
        identifier: 'fluidFpdfDrawPdfFooterEvent'
        event: CodingMs\FluidFpdf\Event\DrawPdfFooterEvent

